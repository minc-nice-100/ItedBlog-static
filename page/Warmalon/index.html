<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Warmalon 🍉</title>
<meta name="description" content="Warmalon - a Suika-style fruit merge game with Warma stickers. 合成大西瓜风格，沃玛表情贴图合成游戏。">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px;
    max-width: 500px;
    width: 100%;
  }

  /* ── Header ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  .title {
    font-size: 28px;
    font-weight: 900;
    color: #e94560;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .scores {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .score-box {
    background: #16213e;
    border-radius: 8px;
    padding: 5px 10px;
    text-align: center;
    min-width: 62px;
  }
  .score-label {
    font-size: 10px;
    color: #7b8ab4;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .score-value {
    font-size: 18px;
    font-weight: 700;
    color: #e94560;
  }

  .btn {
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.94); }
  .btn:hover { opacity: 0.9; }
  .btn.active { background: #00c853; }

  /* ── Canvas area ── */
  .canvas-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(233, 69, 96, 0.15);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ── Overlay ── */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(26, 26, 46, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms;
    border-radius: 12px;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay-text {
    font-size: 32px;
    font-weight: 900;
    color: #e94560;
  }
  .overlay-score {
    font-size: 16px;
    color: #ccc;
  }

  .hint {
    color: #7b8ab4;
    font-size: 12px;
    text-align: center;
  }

  /* ── 合成链图例 ── */
  .chain-info {
    color: #7b8ab4;
    font-size: 13px;
    background: #16213e;
    border-radius: 8px;
    padding: 5px 16px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="header">
    <div class="title">🍉 Warmalon</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">分数</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">最高</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="chain-info" id="chain-info">🍉 距西瓜还差 20 级</div>

  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-text" id="overlay-text"></div>
      <div class="overlay-score" id="overlay-score"></div>
      <button class="btn" id="btn-retry">🔄 再来一局</button>
    </div>
  </div>

  <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center;">
    <button class="btn" id="btn-restart">🔄 重新开始</button>
    <button class="btn" id="btn-auto">🌳 自动玩</button>
    <button class="btn" id="btn-speed">⏩ 1x</button>
  </div>
  <span class="hint">点击 / 轻触 下落 · 自动玩时点击画面可手动接管</span>
</div>

<!-- Matter.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

/** 返回 fruit index 对应的贴图 data URL */
function getFruitImage(idx) {
  return TILE_DATA[idx] || '';
}

// ═══════════════════════════════════════
//  FRUIT DEFINITIONS
//  从小到大，半径递增约 1.2x
// ═══════════════════════════════════════
// 21 级水果链：20 张沃玛充电表情 + 沃玛头像（终极西瓜）
// 半径从 18 按 ~1.095 倍递增到 ~110，分值按三角数
const FRUIT_NAMES = [
  '惊恐', '打烤', '抱抱', '大哭', '酷',
  '恶魔', '感动', '好听', '店员', '投币',
  '融化', '南半球', '捂脸', '毁灭地球', '茄子',
  '疑惑', '晕倒', '蜘蛛', '一几一几', '注视',
  '西瓜',
];
const FRUITS = FRUIT_NAMES.map((name, i) => ({
  name,
  r: Math.round(18 * Math.pow(1.095, i)),
  score: ((i + 1) * (i + 2)) / 2,
  color: '#9e9e9e',
  emoji: '🍉',
}));

// ── Image cache ──
const imageCache = {};
if (USE_IMAGES) {
  FRUITS.forEach((_, i) => {
    const img = new Image();
    img.src = getFruitImage(i);
    imageCache[i] = img;
  });
}

// ═══════════════════════════════════════
//  MATTER.JS SETUP
// ═══════════════════════════════════════
const { Engine, World, Bodies, Body, Events, Composite, Vector } = Matter;

const engine = Engine.create({
  gravity: { x: 0, y: 2.5, scale: 0.001 },
});
engine.positionIterations = 10; // 提高求解精度，减少高速球穿透薄墙

const world = engine.world;

// ── Walls ──
// 注意：物理墙必须与渲染的墙对齐，否则球会“沉”进可见地板里
const wallOpts = { isStatic: true, friction: 0.3, render: { visible: false } };
const leftWall  = Bodies.rectangle(WALL_W / 2, HEIGHT / 2, WALL_W, HEIGHT, wallOpts);
const rightWall = Bodies.rectangle(WIDTH - WALL_W / 2, HEIGHT / 2, WALL_W, HEIGHT, wallOpts);
// 地板顶面 = HEIGHT - WALL_W，正好与渲染的地板墙（HEIGHT-WALL_W 起画）对齐
const floor     = Bodies.rectangle(WIDTH / 2, HEIGHT - WALL_W / 2, WIDTH, WALL_W, wallOpts);
Composite.add(world, [leftWall, rightWall, floor]);

// ═══════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════
let fruits     = [];   // { body, type, createdAt }
let score      = 0;
let best       = 0;
let gameOver   = false;
let lastDropAt = 0;
let nextType   = 0;    // 下一个要下落的水果类型
let previewX   = WIDTH / 2;
let mergeQueue = [];
let overflowTimer    = null;  // 溢出计时
let overflowStart    = 0;
let particleEffects  = [];    // { x, y, life, maxLife, color, radius }

// ── Random next fruit (biased toward small ones) ──
function randomFruitType() {
  // 21 级链：随机掉落前 6 种（0~5），越小概率越高
  const r = Math.random();
  if (r < 0.25) return 0;
  if (r < 0.45) return 1;
  if (r < 0.62) return 2;
  if (r < 0.77) return 3;
  if (r < 0.90) return 4;
  return 5;
}

// ═══════════════════════════════════════
//  DROP FRUIT
// ═══════════════════════════════════════
function dropFruit(x) {
  if (gameOver) return;
  const now = Date.now();
  if (now - lastDropAt < COOLDOWN / SPEED) return;
  lastDropAt = now;

  const type = nextType;
  const def  = FRUITS[type];
  const r    = def.r;

  // Clamp x so fruit stays inside walls
  const minX = WALL_W + r;
  const maxX = WIDTH - WALL_W - r;
  const dropX = Math.max(minX, Math.min(maxX, x));

  const body = Bodies.circle(dropX, DROP_Y - r, r, {
    restitution: 0.25,
    friction: 0.4,
    frictionAir: 0.02,
    density: 0.001,
    fruitType: type,
    label: 'fruit',
  });

  Composite.add(world, body);
  fruits.push({ body, type, createdAt: now });

  // Spawn particles
  spawnParticles(dropX, DROP_Y - r, def.color, 8);

  // Pick next fruit
  nextType = randomFruitType();
}

// ═══════════════════════════════════════
//  PARTICLE EFFECTS
// ═══════════════════════════════════════
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particleEffects.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 0,
      maxLife: 20 + Math.random() * 20,
      color,
      radius: 2 + Math.random() * 3,
    });
  }
}

// ═══════════════════════════════════════
//  COLLISION → MERGE
// ═══════════════════════════════════════
Events.on(engine, 'collisionStart', (event) => {
  for (const pair of event.pairs) {
    const a = pair.bodyA;
    const b = pair.bodyB;
    if (a.fruitType == null || b.fruitType == null) continue;
    if (a.fruitType !== b.fruitType) continue;
    if (a.fruitType >= FRUITS.length - 1) continue; // 西瓜不合并
    if (a.merging || b.merging) continue;

    a.merging = true;
    b.merging = true;
    mergeQueue.push([a, b]);
  }
});

function processMerges() {
  if (mergeQueue.length === 0) return;

  // Dedup: each body should only merge once
  const seen = new Set();
  const valid = [];
  for (const [a, b] of mergeQueue) {
    if (seen.has(a.id) || seen.has(b.id)) continue;
    // Both must still be in the world
    const fa = fruits.find(f => f.body.id === a.id);
    const fb = fruits.find(f => f.body.id === b.id);
    if (!fa || !fb) continue;
    seen.add(a.id);
    seen.add(b.id);
    valid.push([a, b, fa.type]);
  }
  mergeQueue = [];

  for (const [a, b, type] of valid) {
    const newType = type + 1;
    const def = FRUITS[newType];

    // Midpoint
    const midX = (a.position.x + b.position.x) / 2;
    const midY = (a.position.y + b.position.y) / 2;

    // Remove old
    Composite.remove(world, [a, b]);
    fruits = fruits.filter(f => f.body.id !== a.id && f.body.id !== b.id);

    // Create merged fruit
    const body = Bodies.circle(midX, midY, def.r, {
      restitution: 0.25,
      friction: 0.4,
      frictionAir: 0.02,
      density: 0.001,
      fruitType: newType,
      label: 'fruit',
    });

    Composite.add(world, body);
    fruits.push({ body, type: newType, createdAt: Date.now() });

    // Score
    score += def.score;
    updateScore();

    // RL 即时合成奖励信号：按等级指数增长，强烈鼓励往树根走
    if (rlPending) rlPending.mergeReward = (rlPending.mergeReward || 0) + Math.pow(1.3, newType);

    // Particles
    spawnParticles(midX, midY, def.color, 15);
  }
}

// ═══════════════════════════════════════
//  SCORE
// ═══════════════════════════════════════
function updateScore() {
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    try { localStorage.setItem('suika-best', best); } catch (_) {}
  }
  bestEl.textContent = best;
  updateChainInfo();
}

/** 合成链图例：显示当前最大球 + 距西瓜还差几级 */
function updateChainInfo() {
  const el = document.getElementById('chain-info');
  if (!el) return;
  let maxLv = 0;
  for (const f of fruits) if (f.type > maxLv) maxLv = f.type;
  if (maxLv >= 20) el.textContent = '🍉 西瓜已合成！';
  else el.textContent = `当前最大：${FRUITS[maxLv].name} · 距西瓜还差 ${20 - maxLv} 级`;
}

// ═══════════════════════════════════════
//  GAME OVER CHECK
// ═══════════════════════════════════════
function checkGameOver() {
  if (gameOver) return;

  let anyOverflow = false;
  const now = Date.now();

  for (const f of fruits) {
    // Only check fruits that have been in the world for > 1.5s
    if (now - f.createdAt < 1500) continue;
    if (f.body.position.y < DEATH_Y) {
      anyOverflow = true;
      break;
    }
  }

  if (anyOverflow) {
    if (overflowStart === 0) {
      overflowStart = now;
    } else if (now - overflowStart > 2000) {
      endGame();
    }
  } else {
    overflowStart = 0;
  }
}

function endGame() {
  gameOver = true;
  gameOverAt = Date.now();
  // ── 整局蒙特卡洛回传：每个动作的目标 = 它之后累计的合成奖励（return-to-go）──
  let g = 0;
  for (let i = episode.length - 1; i >= 0; i--) {
    g += episode[i].mrg || 0;
    const row = qRow(episode[i].key);
    row[episode[i].col] += qAlpha * (g - row[episode[i].col]);
    Q[episode[i].key] = row;
  }
  if (episode.length) {
    rlSave();
    console.log(`[RL] MC backprop ${episode.length} steps, total merge value=${g.toFixed(1)}`);
    episode = [];
  }
  // 结算最后一次经验：游戏结束重罚
  if (rlPending) {
    const row = qRow(rlPending.key);
    row[rlPending.col] += qAlpha * (-5 - row[rlPending.col]);
    Q[rlPending.key] = row;
    rlSave();
    console.log(`[RL] GAME OVER settle s=${rlPending.key} a=${rlPending.col} r=-5 score=${score}`);
    rlPending = null;
  }
  ovText.textContent = '💀 游戏结束';
  ovScore.textContent = `最终分数：${score}`;
  overlay.classList.add('show');
}

// ═══════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════
function render() {
  const dpr = window.devicePixelRatio || 1;
  const displayW = wrap.clientWidth;
  const displayH = displayW * (HEIGHT / WIDTH);

  canvas.width  = WIDTH * dpr;
  canvas.height = HEIGHT * dpr;
  canvas.style.width  = displayW + 'px';
  canvas.style.height = displayH + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ── Background ──
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // ── Container walls ──
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, WALL_W, HEIGHT);
  ctx.fillRect(WIDTH - WALL_W, 0, WALL_W, HEIGHT);
  ctx.fillRect(0, HEIGHT - WALL_W, WIDTH, WALL_W);

  // Wall highlight
  ctx.strokeStyle = '#2a3a6e';
  ctx.lineWidth = 2;
  ctx.strokeRect(WALL_W, 0, WIDTH - WALL_W * 2, HEIGHT);

  // ── Death line ──
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = 'rgba(233, 69, 96, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(WALL_W, DEATH_Y);
  ctx.lineTo(WIDTH - WALL_W, DEATH_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  // ── Overflow warning ──
  if (overflowStart > 0) {
    const elapsed = Date.now() - overflowStart;
    const alpha = 0.3 + 0.3 * Math.sin(elapsed * 0.01);
    ctx.fillStyle = `rgba(233, 69, 96, ${alpha})`;
    ctx.fillRect(WALL_W, 0, WIDTH - WALL_W * 2, DEATH_Y);
  }

  // ── Fruits ──
  for (const f of fruits) {
    drawFruit(f.body, f.type);
  }

  // ── 下一个球：顶部显示将要下落的贴图，跟随落点线移动 ──
  if (!gameOver) {
    const def = FRUITS[nextType];
    const r = def.r;
    const px = Math.max(WALL_W + r, Math.min(WIDTH - WALL_W - r, previewX));
    const py = r + 4; // 悬停在容器顶部内

    // 贴图预览（半透明，一眼看清“下一个要下的是什么”）
    ctx.globalAlpha = 0.85;
    drawFruitAt(px, py, nextType, r);
    ctx.globalAlpha = 1.0;

    // 落点虚线
    ctx.setLineDash([3, 5]);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, py + r);
    ctx.lineTo(px, HEIGHT);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── Particles ──
  for (const p of particleEffects) {
    const t = p.life / p.maxLife;
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius * (1 - t * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFruit(body, type) {
  drawFruitAt(body.position.x, body.position.y, type, FRUITS[type].r);
}

function drawFruitAt(x, y, type, r) {
  const def = FRUITS[type];

  // 贴图模式
  if (USE_IMAGES && imageCache[type] && imageCache[type].complete) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(imageCache[type], x - r, y - r, r * 2, r * 2);
    ctx.restore();

    // ── 判定环：叠在贴图上，标出球的碰撞边界 ──
    ctx.beginPath();
    ctx.arc(x, y, r - 1, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, r - 1, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
    return;
  }

  // 默认：渐变色圆球
  const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  grad.addColorStop(0, lighten(def.color, 40));
  grad.addColorStop(0.7, def.color);
  grad.addColorStop(1, darken(def.color, 30));

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  // Subtle rim
  ctx.strokeStyle = darken(def.color, 20);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Emoji
  const fontSize = r * 1.1;
  ctx.fillStyle = '#fff';
  ctx.font = `${fontSize}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(def.emoji, x, y + 1);
}

// ── Color helpers ──
function lighten(hex, pct) {
  return adjust(hex, pct);
}
function darken(hex, pct) {
  return adjust(hex, -pct);
}
function adjust(hex, amt) {
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.min(255, Math.max(0, r + amt));
  g = Math.min(255, Math.max(0, g + amt));
  b = Math.min(255, Math.max(0, b + amt));
  return `rgb(${r},${g},${b})`;
}

//  GAME LOOP
// ═══════════════════════════════════════
// ── 强制边界：球碰到容器边缘即拦下、降速并反弹，杜绝穿透 ──
function enforceBounds() {
  const topFace   = HEIGHT - WALL_W;   // 地板顶面
  const leftFace  = WALL_W;
  const rightFace = WIDTH - WALL_W;
  const BOUNCE = 0.35; // 反弹后速度衰减系数

  for (const f of fruits) {
    const b = f.body;
    const r = b.circleRadius;
    const p = b.position;
    const v = b.velocity;

    // 底部：球底不允许越过地板顶面
    if (p.y + r > topFace) {
      Body.setPosition(b, { x: p.x, y: topFace - r });
      if (v.y > 0) Body.setVelocity(b, { x: v.x, y: -v.y * BOUNCE });
    }
    // 左墙
    if (p.x - r < leftFace) {
      Body.setPosition(b, { x: leftFace + r, y: p.y });
      if (v.x < 0) Body.setVelocity(b, { x: -v.x * BOUNCE, y: v.y });
    }
    // 右墙
    if (p.x + r > rightFace) {
      Body.setPosition(b, { x: rightFace - r, y: p.y });
      if (v.x > 0) Body.setVelocity(b, { x: -v.x * BOUNCE, y: v.y });
    }
  }

  // ── 球与球之间：分离重叠 + 相对速度反弹，杜绝互相穿透 ──
  const n = fruits.length;
  for (let i = 0; i < n; i++) {
    const a = fruits[i].body;
    const ra = a.circleRadius;
    for (let j = i + 1; j < n; j++) {
      const b = fruits[j].body;
      const rb = b.circleRadius;
      const dx = b.position.x - a.position.x;
      const dy = b.position.y - a.position.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = ra + rb;
      if (dist < minDist && dist > 0.0001) {
        const overlap = minDist - dist;
        const nx = dx / dist, ny = dy / dist;
        // 沿连线各推开一半
        Body.setPosition(a, { x: a.position.x - nx * overlap / 2, y: a.position.y - ny * overlap / 2 });
        Body.setPosition(b, { x: b.position.x + nx * overlap / 2, y: b.position.y + ny * overlap / 2 });
        // 相对速度若相互靠近，则反弹衰减
        const rvx = b.velocity.x - a.velocity.x;
        const rvy = b.velocity.y - a.velocity.y;
        const rel = rvx * nx + rvy * ny;
        if (rel < 0) {
          const imp = -rel * 0.3;
          Body.setVelocity(a, { x: a.velocity.x - nx * imp, y: a.velocity.y - ny * imp });
          Body.setVelocity(b, { x: b.velocity.x + nx * imp, y: b.velocity.y + ny * imp });
        }
      }
    }
  }
}

function updateParticles() {
  for (const p of particleEffects) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life++;
  }
  particleEffects = particleEffects.filter(p => p.life < p.maxLife);
}

function gameLoop() {
  if (!gameOver) {
    // 加速倍数：每帧跑 SPEED 次物理步进，时间流逝 SPEED 倍
    for (let s = 0; s < SPEED; s++) {
      Engine.update(engine, 1000 / 60);
      updateParticles();
    }
    processMerges();
    enforceBounds();
    checkGameOver();
  } else {
    updateParticles();
  }

  // 训练模式：游戏结束 1.5s 后自动开下一局，持续学习
  if (autoRestart && gameOver && Date.now() - gameOverAt > 1500) {
    init();
    if (!autoPlay) setAutoPlay(true);
  }

  render();
  requestAnimationFrame(gameLoop);
}

/** 顶部 y 量化为堆高等级 */
function rlLevel(topY) { return topY > 520 ? 0 : (topY > 300 ? 1 : 2); }

/** 列 → 落点 x（可指定列数，高速时可减少采样列省算力） */
function colX(col, nCols, type) {
  const r = FRUITS[type].r;
  const left = WALL_W + r + 4, right = WIDTH - WALL_W - r - 4;
  return left + (right - left) * (col + 0.5) / nCols;
}
function rlColX(col, type) { return colX(col, N_COLS, type); }

/** 某列最高球顶部 y */
function colTopAt(x) {
  let top = HEIGHT;
  for (const f of fruits) {
    if (Math.abs(f.body.position.x - x) < f.body.circleRadius) {
      const t = f.body.position.y - f.body.circleRadius;
      if (t < top) top = t;
    }
  }
  return top;
}

/** 离散状态：全局堆高|列堆高|列区域同类数|球等级|场上最大等级 */
function rlStateKey(col, type) {
  const x = rlColX(col, type);
  let g = 0, h = 0, sameLv = 0, maxLv = 0;
  for (const f of fruits) {
    const top = f.body.position.y - f.body.circleRadius;
    const lv = rlLevel(top);
    if (lv > g) g = lv;
    if (Math.abs(f.body.position.x - x) < f.body.circleRadius + FRUITS[type].r) {
      if (lv > h) h = lv;
    }
    // 该列区域同类球数量 → 合成潜力（0/1/2+）
    if (f.type === type && Math.abs(f.body.position.x - x) < f.body.circleRadius + FRUITS[type].r * 2) {
      sameLv++;
    }
    const fv = f.type < 7 ? 0 : (f.type < 14 ? 1 : 2);
    if (fv > maxLv) maxLv = fv;
  }
  if (sameLv > 2) sameLv = 2;
  const lvl = type < 7 ? 0 : (type < 14 ? 1 : 2);
  return `${g}|${h}|${sameLv}|${lvl}|${maxLv}`;
}

 *  + 堆顶同类 → 落下去即合成，加分
 *  - 落球后堆顶逼近死亡线 → 重罚
 *  + 该列剩余空间大 → 加分
 */
/**
 * 1-ply 前瞻：模拟在该列落球后的价值
 *  - 堆顶有同类 → 预估合成收益（按合成后的等级算）
 *  - 该列同类球越多 → 合成潜力越大
 *  - 落球后堆顶逼近死亡线 → 重罚
 *  - 剩余空间、中央偏好
 * 作为决策主项（先验），Q 学习在其上微调
 */
function simulateCol(x, type) {
  const r = FRUITS[type].r;
  let colTop = HEIGHT;
  let sameCount = 0;
  for (const f of fruits) {
    if (Math.abs(f.body.position.x - x) < f.body.circleRadius + r) {
      const top = f.body.position.y - f.body.circleRadius;
      if (top < colTop) colTop = top;
    }
    if (f.type === type && Math.abs(f.body.position.x - x) < f.body.circleRadius + r * 2) sameCount++;
  }

  let s = 0;
  const canMerge = sameCount > 0 && colTop > 400; // 堆顶有同类 → 落下去即合成
  if (canMerge) {
    s += 12 + Math.pow(1.3, type + 1) * 0.6;      // 合成收益（按新等级）
  }
  const safeRoom = colTop - DEATH_Y;
  if (safeRoom < 0) s -= 40;                      // 禁区重罚
  else s += Math.min(safeRoom / 8, 6);            // 空间奖励
  s += Math.min(sameCount, 3) * 2;                // 同类数量 → 合成潜力
  s -= Math.abs(x - WIDTH / 2) * 0.3;             // 中央偏好
  return s;
}

/**
 * 蒙特卡洛模拟（论文《Creating an AI that Plays Suika Game》最佳方法）：
 * 建离屏物理引擎，复制当前球为静态底，丢入候选球，跑短时物理，
 * 统计合成收益与最终堆高，返回综合评分。
 */
function mcSimulate(x, type) {
  const r = FRUITS[type].r;
  const eng = Engine.create({ gravity: { x: 0, y: 2.5, scale: 0.001 } });
  const wallOpts = { isStatic: true, friction: 0.3 };
  Composite.add(eng.world, [
    Bodies.rectangle(WALL_W / 2, HEIGHT / 2, WALL_W, HEIGHT * 2, wallOpts),
    Bodies.rectangle(WIDTH - WALL_W / 2, HEIGHT / 2, WALL_W, HEIGHT * 2, wallOpts),
    Bodies.rectangle(WIDTH / 2, HEIGHT - WALL_W + 40, WIDTH * 2, 80, wallOpts), // 厚底防穿透
  ]);

  const simBodies = [];
  for (const f of fruits) {
    const b = Bodies.circle(f.body.position.x, f.body.position.y, f.body.circleRadius, {
      isStatic: true, fruitType: f.type,
    });
    simBodies.push(b);
    Composite.add(eng.world, b);
  }

  const ball = Bodies.circle(x, DROP_Y - r, r, {
    restitution: 0.25, friction: 0.4, frictionAir: 0.02, density: 0.001, fruitType: type,
  });
  Composite.add(eng.world, ball);
  simBodies.push(ball);

  let mergeValue = 0;
  let ballGone = false;   // 新球是否已合成（并入更大球）
  const queue = [];
  Events.on(eng, 'collisionStart', (ev) => {
    for (const p of ev.pairs) {
      const a = p.bodyA, b = p.bodyB;
      if (a.fruitType == null || b.fruitType == null) continue;
      if (a.fruitType !== b.fruitType) continue;
      if (a.fruitType >= FRUITS.length - 1) continue;
      if (a.merging || b.merging) continue;
      a.merging = true; b.merging = true;
      queue.push([a, b]);
    }
  });

  const processMergesSim = () => {
    if (!queue.length) return;
    const seen = new Set();
    const valid = [];
    for (const [a, b] of queue) {
      if (seen.has(a.id) || seen.has(b.id)) continue;
      if (!simBodies.includes(a) || !simBodies.includes(b)) continue;
      seen.add(a.id); seen.add(b.id);
      valid.push([a, b]);
    }
    queue.length = 0;
    for (const [a, b] of valid) {
      const nt = a.fruitType + 1;
      mergeValue += Math.pow(1.3, nt);
      const midX = (a.position.x + b.position.x) / 2;
      const midY = (a.position.y + b.position.y) / 2;
      Composite.remove(eng.world, [a, b]);
      simBodies.splice(simBodies.indexOf(a), 1);
      simBodies.splice(simBodies.indexOf(b), 1);
      if (a === ball || b === ball) ballGone = true;
      const nb = Bodies.circle(midX, midY, FRUITS[nt].r, {
        restitution: 0.25, friction: 0.4, frictionAir: 0.02, density: 0.001, fruitType: nt,
      });
      Composite.add(eng.world, nb);
      simBodies.push(nb);
    }
  };

  const steps = SPEED >= 4 ? 90 : 160;
  for (let i = 0; i < steps; i++) {
    Engine.update(eng, 1000 / 60);
    processMergesSim();
  }

  // 评估：新球停稳位置 → 堆高风险；合成收益 → 加分
  const bottom = ballGone ? HEIGHT : ball.position.y + ball.circleRadius;
  const safeRoom = (bottom - r) - DEATH_Y;
  let score = mergeValue;
  if (safeRoom < 0) score -= 40;                 // 禁区重罚
  else score += Math.min(safeRoom / 6, 12);      // 空间奖励（更显著）
  score -= Math.abs(x - WIDTH / 2) * 0.03;       // 中央偏好（仅平局打破，不压制边缘列）
  // 返回完整诊断：ballY=-1 表示新球已合成消失
  return { score, ballY: ballGone ? -1 : Math.round(ball.position.y), mergeValue };
}

/** 自动走一步：蒙特卡洛决策，并在下一次决策时结算上一动作的奖励 */
function autoStep() {
  if (!autoPlay || gameOver) return;
  const type = nextType;

  // ── 结算上一次决策（间隔约 450ms，物理已大致稳定）──
  if (rlPending) {
    const top = colTopAt(rlPending.x);
    let r = (rlPending.mergeReward || 0) - 0.05; // 合成即时奖励 - 每步小罚
    if (top < 120) r -= 1;      // 落点列堆顶贴近死亡线 → 危险罚分
    if (gameOver) r -= 5;       // 游戏结束 → 重罚
    const row = qRow(rlPending.key);
    const before = row[rlPending.col];
    row[rlPending.col] += qAlpha * (r - row[rlPending.col]); // bandit 更新（与 Python 训练一致，无自举不爆炸）
    Q[rlPending.key] = row;
    if (Math.abs(row[rlPending.col]) > 1000) console.warn(`[RL] Q anomaly s=${rlPending.key} a=${rlPending.col} Q=${row[rlPending.col].toFixed(0)}`);
    rlSave();
    console.log(`[RL] settle s=${rlPending.key} a=${rlPending.col} r=${r.toFixed(2)} mrg=${rlPending.mergeReward || 0} Q=${before.toFixed(2)}->${row[rlPending.col].toFixed(2)} score=${score}`);

    // ── 经验回放：历史经验再学几遍，稀疏的合成经验不丢 ──
    replay.push({ key: rlPending.key, col: rlPending.col, r });
    if (replay.length > REPLAY_MAX) replay.shift();
    for (let k = 0; k < REPLAY_N && replay.length; k++) {
      const e = replay[Math.floor(Math.random() * replay.length)];
      const rr = qRow(e.key);
      rr[e.col] += qAlpha * (e.r - rr[e.col]);
      Q[e.key] = rr;
    }

    // 同步本局轨迹的合成奖励（供整局蒙特卡洛回传）
    if (episode.length) episode[episode.length - 1].mrg = rlPending.mergeReward || 0;

    qAlpha = Math.max(0.05, qAlpha * 0.9995); // 学习率随学习次数微降
    rlPending = null;
  }

  // ── ε-greedy 选列 ──
  const exploring = Math.random() < QEPS;
  let col, x;
  if (exploring) {
    // 合成导向探索：只在安全列里随机，且该列同类球越多被选中概率越高
    const safe = []; // [col, weight]
    for (let c = 0; c < N_COLS; c++) {
      if (colTopAt(rlColX(c, type)) > DEATH_Y + 60) {
        let w = 1;
        for (const f of fruits) {
          if (f.type === type && Math.abs(f.body.position.x - rlColX(c, type)) < f.body.circleRadius + FRUITS[type].r * 2) w += 3;
        }
        safe.push([c, w]);
      }
    }
    if (safe.length) {
      let total = 0; for (const [, w] of safe) total += w;
      let pick = Math.random() * total;
      col = safe[0][0];
      for (const [c, w] of safe) { pick -= w; if (pick <= 0) { col = c; break; } }
    } else {
      col = Math.floor(Math.random() * N_COLS);
    }
    x = rlColX(col, type);
  } else {
    // ── 蒙特卡洛决策（论文最佳方法）：离屏物理模拟每个候选落点，选收益最高 ──
    const mcCols = SPEED >= 4 ? 8 : N_COLS; // 高速时减少采样列省算力
    const t0mc = performance.now();
    const mcResults = [];
    let bestVal = -Infinity, bestC = 0;
    for (let c = 0; c < mcCols; c++) {
      const cx = colX(c, mcCols, type);
      const qc = Math.min(N_COLS - 1, Math.round((c + 0.5) * N_COLS / mcCols - 0.5));
      let sim;
      try {
        sim = mcSimulate(cx, type);
      } catch (e) {
        console.error(`[MC] simulate error x=${Math.round(cx)} type=${type}:`, e);
        sim = { score: -999, ballY: -999, mergeValue: 0 };
      }
      const v = sim.score + qRow(rlStateKey(qc, type))[qc] * 0.1; // 预加载权重做温和先验，MC 真实物理主导
      mcResults.push({ c, x: cx, v, y: sim.ballY, mrg: sim.mergeValue });
      if (v > bestVal) { bestVal = v; bestC = c; }
    }
    const mcMs = performance.now() - t0mc;
    if (mcMs > 300) console.warn(`[MC] slow decision ${mcMs.toFixed(0)}ms (${mcCols} sims)`);
    mcResults.sort((a, b) => b.v - a.v);
    console.log(`[MC] top: ${mcResults.slice(0, 3).map(r => `c${r.c} x${Math.round(r.x)} y=${r.y} mrg=${r.mrg.toFixed(1)} v=${r.v.toFixed(1)}`).join('  |  ')}  (${mcMs.toFixed(0)}ms)`);
    x = colX(bestC, mcCols, type);
    col = Math.min(N_COLS - 1, Math.round((bestC + 0.5) * N_COLS / mcCols - 0.5));
  }
  console.log(`[RL] ${exploring ? 'EXPLORE' : 'EXPLOIT'} col=${col} next=#${type}(${FRUITS[type].name}) eps=${QEPS.toFixed(2)} Qstates=${Object.keys(Q).length}`);

  previewX = x; // 影子跟随，方便观察 AI 意图
  rlPending = { key: rlStateKey(col, type), col, x, mergeReward: 0 };
  episode.push({ key: rlPending.key, col, mrg: 0 });
  rlStepCount++;
  if (rlStepCount % 30 === 0) {
    let maxLv = 0;
    for (const f of fruits) if (f.type > maxLv) maxLv = f.type;
    console.log(`[RL] state: fruits=${fruits.length} maxLv=${maxLv}(${FRUITS[maxLv].name}) Qstates=${Object.keys(Q).length} eps=${QEPS.toFixed(2)} alpha=${qAlpha.toFixed(3)} replay=${replay.length} score=${score}`);
  }
  dropFruit(x);
}

function setAutoPlay(on) {
  autoPlay = on;
  const btn = document.getElementById('btn-auto');
  if (on) {
    btn.textContent = '⏸ 停止自动';
    btn.classList.add('active');
    autoTimer = setInterval(autoStep, 450 / SPEED);
  } else {
    btn.textContent = '🌳 自动玩';
    btn.classList.remove('active');
    clearInterval(autoTimer);
    autoTimer = null;
  }
}

// ── 速度倍数：1x → 2x → 4x → 8x 循环；控制台可 setSpeed(n) 任意倍数 ──
const speedBtn = document.getElementById('btn-speed');
function applySpeed(n) {
  SPEED = n;
  speedBtn.textContent = '⏩ ' + SPEED + 'x';
  // 切速时同步自动玩节奏（决策频率 = 450/SPEED ms，流速越高学习越快）
  if (autoPlay) {
    clearInterval(autoTimer);
    autoTimer = setInterval(autoStep, 450 / SPEED);
  }
  console.log(`[SPD] speed=${SPEED}x autoPlay=${autoPlay}`);
}
speedBtn.addEventListener('click', () => {
  const speeds = [1, 2, 4, 8];
  applySpeed(speeds[(speeds.indexOf(SPEED) + 1) % speeds.length]);
});
// ── 控制台接口 ──
window.setSpeed = applySpeed;      // 用法：setSpeed(32) / setSpeed(1)
window.getSpeed = () => SPEED;     // 用法：getSpeed()
// 控制台一条龙：先开自动玩再提速
window.train = (n) => {
  if (!autoPlay) setAutoPlay(true);
  applySpeed(n || 32);
  window.setAutoRestart(true);
  console.log('[RL] 🚀 training mode: auto + speed + auto-restart');
};

// ── 自动重开：游戏结束 1.5s 后自动开下一局，跨局持续学习 ──
let autoRestart = false;
let gameOverAt = 0;
window.setAutoRestart = (on) => { autoRestart = !!on; console.log(`[RL] autoRestart=${autoRestart}`); };

document.getElementById('btn-auto').addEventListener('click', () => setAutoPlay(!autoPlay));

// ═══════════════════════════════════════
//  INIT / RESTART
// ═══════════════════════════════════════
function init() {
  // Clear all fruits
  for (const f of fruits) {
    Composite.remove(world, f.body);
  }
  fruits = [];
  mergeQueue = [];
  particleEffects = [];
  replay = [];
  episode = [];
  score = 0;
  gameOver = false;
  overflowStart = 0;
  lastDropAt = 0;
  previewX = WIDTH / 2;
  nextType = randomFruitType();
  updateScore();
  overlay.classList.remove('show');
  // 探索率随局数衰减：越玩越利用 Q 表（跨局持久化）
  QEPS = Math.max(0.1, QEPS * 0.92);
  try { localStorage.setItem('suika-eps', QEPS); } catch (_) {}
  if (autoPlay) setAutoPlay(false);
}

document.getElementById('btn-restart').addEventListener('click', init);
document.getElementById('btn-retry').addEventListener('click', init);

// ═══════════════════════════════════════
//  START
// ═══════════════════════════════════════
try {
  best = parseInt(localStorage.getItem('suika-best')) || 0;
} catch (_) { best = 0; }
bestEl.textContent = best;
init();
gameLoop();
</script>
